<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ScheduCal">
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="ScheduCal">
    <title>ScheduCal • Dear Trader</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Performance: Preconnect to CDNs -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    
    <!-- Critical Font Preload -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=SF+Pro+Display:wght@400;500;600&amp;display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=SF+Pro+Display:wght@400;500;600&amp;display=swap"></noscript>
    
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=SF+Pro+Display:wght@400;500;600&amp;display=swap');
        
        :root { --accent: #007AFF; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "ss02";
        }
        
        .dark body { background-color: #0f172a; color: #f1f5f9; }
        
        .ios-shadow { box-shadow: 0 10px 30px -15px rgb(0 0 0 / 0.12), 0 4px 6px -1px rgb(0 0 0 / 0.06); }
        .dark .ios-shadow { box-shadow: 0 10px 30px -15px rgb(0 0 0 / 0.3); }
        
        .calendar-day { 
            transition: transform 0.1s ease, background-color 0.1s ease; 
            min-height: 48px; /* Smaller for full month visibility */
            contain: layout paint;
            position: relative;
            overflow: hidden;
        }
        
        /* Beautiful SVG background pattern for day cells */
        .calendar-day::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><circle cx=%2250%22 cy=%2250%22 r=%221%22 fill=%22%23e2e8f0%22 opacity=%220.4%22/></svg>');
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
        }
        
        .dark .calendar-day::before {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><circle cx=%2250%22 cy=%2250%22 r=%221%22 fill=%22%234b5563%22 opacity=%220.3%22/></svg>');
        }
        
        @media (max-width: 767px) {
            .calendar-day {
                min-height: 42px; /* Even smaller on mobile */
                padding: 4px;
            }
        }
        
        @media (min-width: 768px) { .calendar-day { min-height: 58px; } }
        .calendar-day:active { transform: scale(0.96); }
        .calendar-day:hover { background-color: #f1f5f9; }
        .dark .calendar-day:hover { background-color: #1e2937; }
        .calendar-day.selected { background-color: #dbeafe; box-shadow: inset 0 0 0 2.5px #007AFF; }
        .dark .calendar-day.selected { background-color: #1e40af; box-shadow: inset 0 0 0 2.5px #60a5fa; }
        .calendar-day.today { background-color: #ecfdf5; }
        .dark .calendar-day.today { background-color: #064e3b; }
        .calendar-day.other-month { color: #94a3b8; }
        
        .event-pill { font-size: 8.5px; padding: 1px 5px; border-radius: 9999px; }
        
        .section-header { font-size: 11px; font-weight: 700; letter-spacing: -.5px; color: #64748b; }
        .dark .section-header { color: #94a3b8; }
        
        .premium-font { font-weight: 600; letter-spacing: -.4px; }
        
        .floating-orb {
            animation: floatOrb 9s ease-in-out infinite;
            filter: blur(32px);
            opacity: 0.32;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0); /* Force GPU acceleration */
        }
        
        @media (max-width: 767px) {
            .floating-orb {
                filter: blur(24px); /* Lighter blur on mobile for performance */
                animation-duration: 12s; /* Slower on mobile */
            }
        }

        /* Prevent overextension on mobile */
        .main-container, .calendar-grid, .agenda-list, .day-details {
            max-width: 100% !important;
            overflow-x: hidden;
        }

        .event-pill, .task-item {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 767px) {
            .calendar-grid {
                gap: 3px;
            }
            
            .agenda-list {
                padding: 10px;
            }
            
            .event-pill {
                font-size: 11.5px;
                padding: 5px 9px;
            }
            
            .calendar-day {
                padding: 5px;
                min-height: 52px;
            }
        }

        /* === MOBILE-FIRST + PERCENTAGE SCALES IMPROVEMENTS === */
        :root {
            --fluid-font-base: clamp(13px, 3.8vw, 15px);
            --fluid-font-lg: clamp(15px, 4.2vw, 18px);
            --fluid-font-xl: clamp(17px, 4.8vw, 21px);
        }

        body {
            font-size: var(--fluid-font-base);
            -webkit-user-select: none; /* Prevent easy copying */
            user-select: none;
        }
        
        /* Allow selection only on text inputs and content areas */
        input, textarea, .selectable {
            -webkit-user-select: text;
            user-select: text;
        }

        .calendar-day {
            min-height: 58px;
            padding: 6px;
        }
        @media (min-width: 768px) {
            .calendar-day { min-height: 82px; padding: 8px; }
        }

        .event-pill {
            font-size: clamp(7.5px, 2.1vw, 9px);
            padding: 2px 6px;
        }

        .section-header {
            font-size: clamp(9.5px, 2.6vw, 11px);
        }

        .premium-font {
            font-size: var(--fluid-font-lg);
        }

        .ios-shadow {
            box-shadow: 0 8px 25px -12px rgb(0 0 0 / 0.1), 0 3px 5px -1px rgb(0 0 0 / 0.05);
        }

        /* Better mobile touch targets */
        button, .calendar-day, .event-pill {
            min-height: 44px;
        }

        @media (max-width: 767px) {
            .calendar-day {
                min-height: 54px;
                font-size: 13px;
            }
            
            .bottom-nav {
                padding-bottom: env(safe-area-inset-bottom, 8px);
            }
            
            .fab {
                bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            }
        }

        /* Percentage-based containers - Prevent Overflow */
        .main-container, #view-container, .calendar-grid, .agenda-list, .day-details {
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
            box-sizing: border-box;
        }

        .day-details {
            width: 100%;
            max-width: 100%;
        }

        /* Force all content to stay in viewport */
        body, html {
            overflow-x: hidden;
            max-width: 100vw;
        }

        /* Safe area handling for notched phones */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .dark .floating-orb { opacity: 0.22; }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(18px, -22px) scale(1.1); }
        }
        
        .nav-active { color: #007AFF; font-weight: 700; }
        .dark .nav-active { color: #60a5fa; }
        
        .glass { background: rgba(255,255,255,0.88); backdrop-filter: blur(22px); }
        .dark .glass { background: rgba(15,23,42,0.88); backdrop-filter: blur(22px); }
        
        .theme-toggle { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .theme-toggle:active { transform: scale(0.88) rotate(25deg); }
        
        .view-btn { transition: all 0.1s ease; }
        .view-btn.active { background-color: #007AFF; color: white; box-shadow: 0 2px 8px rgb(0 122 255 / 0.3); }
        
        .week-day-header { font-size: 10px; font-weight: 700; color: #64748b; }
        .dark .week-day-header { color: #94a3b8; }
    </style>
</head>
<body class="bg-[#f8fafc] text-gray-900 dark:bg-[#0f172a] dark:text-[#f1f5f9]">
    <!-- Animated Background Orbs -->
    <div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
        <svg class="floating-orb absolute top-[10%] left-[6%] w-44 h-44 text-[#007AFF]" viewBox="0 0 200 200"><circle cx="100" cy="100" r="85" fill="currentColor"/></svg>
        <svg class="floating-orb absolute bottom-[15%] right-[10%] w-36 h-36 text-emerald-400" style="animation-delay: -3.8s;" viewBox="0 0 200 200"><circle cx="100" cy="100" r="72" fill="currentColor"/></svg>
        <svg class="floating-orb absolute top-[38%] right-[18%] w-28 h-28 text-amber-400" style="animation-delay: -6.5s;" viewBox="0 0 200 200"><circle cx="100" cy="100" r="58" fill="currentColor"/></svg>
    </div>
    
    <!-- Header -->
    <header class="bg-white/95 dark:bg-[#0f172a]/95 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50 backdrop-blur-xl safe-top">
        <div class="max-w-[1320px] mx-auto px-4 md:px-6 h-14 md:h-16 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div onclick="showConfetti()" class="w-9 h-9 md:w-10 md:h-10 bg-gradient-to-br from-[#007AFF] to-[#0056b3] rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 active:scale-95 cursor-pointer">
                    <i class="fas fa-calendar-alt text-white text-xl md:text-2xl"></i>
                </div>
                <div>
                    <h1 class="premium-font text-2xl tracking-tighter">ScheduCal</h1>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 -mt-1 hidden md:block" id="user-location">Abuja, NG</p>
                </div>
            </div>
            
            <!-- View Switcher -->
            <div class="flex items-center bg-gray-100 dark:bg-gray-800 rounded-3xl p-0.5">
                <button onclick="switchView('month')" id="view-month" class="view-btn active px-4 py-1 text-xs md:text-sm font-semibold rounded-3xl flex items-center gap-1.5">
                    <i class="fas fa-th-large text-xs"></i> <span class="hidden md:inline">Month</span>
                </button>
                <button onclick="switchView('week')" id="view-week" class="view-btn px-4 py-1 text-xs md:text-sm font-semibold rounded-3xl flex items-center gap-1.5">
                    <i class="fas fa-calendar-week text-xs"></i> <span class="hidden md:inline">Week</span>
                </button>
                <button onclick="switchView('agenda')" id="view-agenda" class="view-btn px-4 py-1 text-xs md:text-sm font-semibold rounded-3xl flex items-center gap-1.5">
                    <i class="fas fa-list text-xs"></i> <span class="hidden md:inline">Agenda</span>
                </button>
            </div>
            
            <div class="flex items-center gap-x-2 md:gap-x-3">
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="theme-toggle w-9 h-9 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-2xl">
                    <i id="theme-icon" class="fas fa-moon text-lg"></i>
                </button>
                
                <!-- Live Clock -->
                <div class="hidden md:flex items-center bg-gray-100 dark:bg-gray-800 rounded-3xl px-3.5 py-1 text-sm">
                    <i class="fas fa-clock text-gray-400 dark:text-gray-500 mr-1.5 text-xs"></i>
                    <span id="live-clock" class="font-mono font-medium text-gray-700 dark:text-gray-300">20:42</span>
                </div>
                
                <!-- Search -->
                <button onclick="showSearchModal()" class="w-9 h-9 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-2xl">
                    <i class="fas fa-search text-lg"></i>
                </button>
                
                <!-- Profile -->
                <div onclick="showProfileModal()" class="flex items-center pl-2 md:pl-3 border-l border-gray-200 dark:border-gray-700 cursor-pointer active:opacity-80">
                    <div id="profile-avatar" class="w-8 h-8 rounded-2xl flex items-center justify-center text-white text-sm font-bold ring-2 ring-white dark:ring-gray-800 shadow-sm" style="background: linear-gradient(135deg, #f59e0b, #d97706);">DT</div>
                </div>

                <!-- Install PWA Button -->
                <button onclick="installPWA()" id="install-btn" class="hidden md:flex items-center gap-1.5 px-3 py-1.5 bg-[#007AFF] text-white text-xs font-semibold rounded-2xl active:scale-95">
                    <i class="fas fa-download text-xs"></i>
                    <span>Install</span>
                </button>
            </div>
        </div>
    </header>
    
    <div class="max-w-[1320px] mx-auto flex flex-col md:flex-row min-h-[calc(100dvh-3.5rem)] md:min-h-[calc(100vh-4rem)] relative pb-16 md:pb-0">
        
        <!-- LEFT SIDEBAR -->
        <div class="hidden md:flex w-72 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0f172a] p-5 flex-col overflow-y-auto">
            <!-- Mini Calendar -->
            <div class="mb-5">
                <div class="flex items-center justify-between mb-3 px-1">
                    <span class="section-header">MINI CALENDAR</span>
                    <div class="flex gap-1">
                        <button onclick="miniPrevMonth()" class="w-6 h-6 text-gray-400 hover:text-gray-600"><i class="fas fa-chevron-left text-xs"></i></button>
                        <button onclick="miniNextMonth()" class="w-6 h-6 text-gray-400 hover:text-gray-600"><i class="fas fa-chevron-right text-xs"></i></button>
                    </div>
                </div>
                <div id="mini-calendar" class="grid grid-cols-7 gap-px bg-gray-100 dark:bg-gray-800 p-px rounded-2xl text-xs"></div>
            </div>
            
            <!-- Quick Add -->
            <div class="mb-5">
                <span class="section-header px-1">QUICK ADD</span>
                <div class="mt-2 flex gap-2">
                    <input id="quick-add-input" type="text" placeholder="Meeting tomorrow at 3pm" 
                           class="flex-1 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl px-4 py-2 text-sm outline-none focus:border-[#007AFF]"
                           onkeyup="if (event.key === 'Enter') quickAddNaturalLanguage()">
                    <button onclick="quickAddNaturalLanguage()" class="px-4 bg-[#007AFF] text-white rounded-2xl text-sm font-semibold active:bg-[#0066cc]">Add</button>
                </div>
                <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-1 px-1">Try: "Call with client Friday 2pm"</p>
            </div>
            
            <!-- Upcoming -->
            <div class="flex-1 min-h-0">
                <div class="flex items-center justify-between mb-3 px-1">
                    <span class="section-header">UPCOMING</span>
                    <span onclick="showAllEvents()" class="text-xs text-[#007AFF] dark:text-[#60a5fa] hover:underline cursor-pointer font-semibold">All</span>
                </div>
                <div id="upcoming-list" class="space-y-1 text-sm overflow-y-auto max-h-[220px] pr-1 custom-scroll"></div>
            </div>
            
            <div class="mt-auto pt-4 border-t border-gray-200 dark:border-gray-800 text-center">
                <div class="inline-flex items-center gap-2 text-xs text-gray-400 dark:text-gray-500">
                    <i class="fas fa-sync-alt"></i> <span>Synced • Local</span>
                </div>
            </div>
        </div>
        
        <!-- MAIN CONTENT -->
        <div class="flex-1 p-3 md:p-6 flex flex-col min-w-0 overflow-hidden" id="main-content">
            <!-- Dynamic View Container -->
            <div id="view-container" class="flex-1 min-h-0 overflow-hidden"></div>
            
            <div class="hidden md:block text-center mt-3 text-xs text-gray-400 dark:text-gray-500">
                Double-tap any day to quick add • Use natural language above
            </div>
        </div>
        
        <!-- RIGHT PANEL (Desktop) -->
        <div class="hidden md:flex w-80 border-l border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0f172a] flex-col">
            <div class="p-5 border-b border-gray-200 dark:border-gray-800">
                <div id="selected-date-header" class="mb-1"></div>
                <div id="selected-date-badge" class="inline-flex items-center text-xs font-semibold px-3 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300"></div>
            </div>
            
            <div class="p-5 flex-1 overflow-y-auto custom-scroll">
                <!-- Calendars -->
                <div class="mb-4">
                    <span class="section-header">CALENDARS</span>
                    <div id="calendar-list" class="mt-2 space-y-1"></div>
                </div>
                
                <div class="flex items-center justify-between mb-3">
                    <span class="section-header">SCHEDULE</span>
                    <span id="event-count" class="text-xs px-2.5 py-0.5 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 rounded-full font-medium"></span>
                </div>
                
                <div id="events-list" class="space-y-2 mb-5 min-h-[90px]"></div>
                
                <!-- Tasks -->
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="section-header">TODAY'S TASKS</span>
                        <button onclick="addQuickTask()" class="text-[#007AFF] dark:text-[#60a5fa] text-xs font-semibold flex items-center gap-1">
                            <i class="fas fa-plus text-xs"></i> Add
                        </button>
                    </div>
                    <div id="tasks-list" class="space-y-1 min-h-[50px]"></div>
                </div>
                
                <!-- Add Event Form -->
                <div class="bg-[#f8f9fc] dark:bg-gray-900 rounded-3xl p-4 border border-gray-100 dark:border-gray-800">
                    <div class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-3 px-1">NEW EVENT</div>
                    <form id="event-form" onsubmit="handleEventSubmit(event)">
                        <div class="space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">Time</label>
                                    <input type="time" id="event-time" required class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-3 py-2 text-sm outline-none">
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">Calendar</label>
                                    <select id="event-calendar" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-3 py-2 text-sm outline-none">
                                        <option value="personal">Personal</option>
                                        <option value="work">Work</option>
                                        <option value="trading">Trading</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div>
                                <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">Title</label>
                                <input type="text" id="event-title" placeholder="Team sync or market call" required class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-3 py-2 text-sm outline-none">
                            </div>
                            
                            <div>
                                <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">Notes</label>
                                <textarea id="event-description" rows="2" placeholder="Key points..." class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-3 py-2 text-sm outline-none resize-y"></textarea>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">Reminder</label>
                                    <select id="event-alert" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-3 py-2 text-sm outline-none">
                                        <option value="">None</option>
                                        <option value="5">5 min before</option>
                                        <option value="15">15 min before</option>
                                        <option value="30">30 min before</option>
                                        <option value="60">1 hour before</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-gray-600 dark:text-gray-400 block mb-1">Repeat</label>
                                    <select id="event-recurring" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-3 py-2 text-sm outline-none">
                                        <option value="">No repeat</option>
                                        <option value="daily">Daily</option>
                                        <option value="weekly">Weekly</option>
                                        <option value="monthly">Monthly</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 mt-4">
                            <button type="button" onclick="cancelEventEdit()" class="flex-1 py-2.5 text-sm font-semibold bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 rounded-2xl">Cancel</button>
                            <button type="submit" id="submit-btn" class="flex-1 py-2.5 text-sm font-semibold bg-[#007AFF] text-white rounded-2xl active:bg-[#0066cc]">Add Event</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Daily Summary -->
            <div class="border-t border-gray-200 dark:border-gray-800 p-5 bg-white dark:bg-[#0f172a]">
                <div class="flex items-center justify-between mb-2">
                    <span class="section-header">DAILY SUMMARY</span>
                </div>
                <textarea id="daily-summary" rows="3" placeholder="Wins, market notes, reflections..." onblur="saveDailySummary()" class="w-full text-sm bg-[#f8f9fc] dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl p-3 resize-y outline-none"></textarea>
                <div class="text-right mt-1"><span class="text-[10px] text-gray-400 dark:text-gray-500">Auto-saved</span></div>
            </div>
        </div>
    </div>
    
    <!-- Mobile Bottom Nav -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-[#0f172a]/95 border-t border-gray-200 dark:border-gray-800 z-50 backdrop-blur-xl safe-bottom">
        <div class="grid grid-cols-4 h-14">
            <button onclick="switchMobileTab(0)" class="flex flex-col items-center justify-center text-xs font-medium text-gray-500 dark:text-gray-400 active:text-[#007AFF] nav-active" id="nav-0">
                <i class="fas fa-th-large text-lg mb-0.5"></i><span>Month</span>
            </button>

    <!-- Toast -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-5 right-5 z-[200] flex flex-col gap-2"></div>
    
    <script>
        // Tailwind + Theme
        function initTailwind() {
            tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { 'sf': ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Inter', 'system-ui', 'sans-serif'] } } } };
            
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            } else {
                updateThemeIcon(false);
            }
        }
        
        function updateThemeIcon(isDark) {
            const icon = document.getElementById('theme-icon');
            if (icon) icon.className = isDark ? 'fas fa-sun text-lg' : 'fas fa-moon text-lg';
        }
        
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
            showToast(isDark ? 'Dark mode enabled' : 'Light mode enabled', 'info', 1200);
        }
        
        // State
        let events = [];
        let tasks = [];
        let summaries = {};
        let timers = {};
        let currentViewDate = new Date();
        let selectedDateStr = '';
        let editingEventId = null;
        let miniViewDate = new Date();
        let currentMobileTab = 0;
        let currentView = 'month';
        let userProfile = { name: 'Dear Trader', location: 'Abuja, NG', avatarColor: '#f59e0b' };
        
        const CALENDAR_COLORS = {
            personal: '#007AFF',
            work: '#10b981',
            trading: '#f59e0b'
        };
        
        function loadData() {
            const savedEvents = localStorage.getItem('calEvents');
            if (savedEvents) events = decryptData(savedEvents);
            
            const savedTasks = localStorage.getItem('calTasks');
            if (savedTasks) tasks = decryptData(savedTasks);
            
            const savedSummaries = localStorage.getItem('calSummaries');
            if (savedSummaries) summaries = decryptData(savedSummaries);
            
            const savedProfile = localStorage.getItem('userProfile');
            if (savedProfile) userProfile = decryptData(savedProfile);
            
            if (events.length === 0) {
                const today = new Date();
                const todayStr = today.toISOString().split('T')[0];
                events = [
                    { id: 'e1', date: todayStr, time: '09:30', title: 'NSE Market Open', description: 'Monitor opening bell', alertMinutes: 15, calendar: 'trading', recurring: '' },
                    { id: 'e2', date: todayStr, time: '14:00', title: 'Portfolio Review', description: 'Weekly check', alertMinutes: 30, calendar: 'work', recurring: 'weekly' },
                    { id: 'e3', date: '2026-05-20', time: '11:00', title: 'Earnings Call - Dangote', description: 'Q4 results', alertMinutes: 60, calendar: 'trading', recurring: '' }
                ];
                localStorage.setItem('calEvents', encryptData(events));
            }
            
            if (tasks.length === 0) {
                const todayStr = getDateStr(new Date());
                tasks = [
                    { id: 't1', date: todayStr, text: 'Review Q2 positions', done: false },
                    { id: 't2', date: todayStr, text: 'Send weekly report', done: true }
                ];
                localStorage.setItem('calTasks', JSON.stringify(tasks));
            }
            
            updateProfileUI();
            renderCalendarList();
        }
        
        // Simple Encryption for localStorage (protects against casual inspection)
        const ENCRYPTION_KEY = 'ScheduCal2026!SecureKey';

        function encryptData(data) {
            try {
                const str = JSON.stringify(data);
                let encrypted = '';
                for (let i = 0; i < str.length; i++) {
                    encrypted += String.fromCharCode(str.charCodeAt(i) ^ ENCRYPTION_KEY.charCodeAt(i % ENCRYPTION_KEY.length));
                }
                return btoa(encrypted); // Base64 encode
            } catch (e) {
                return JSON.stringify(data); // Fallback
            }
        }

        function decryptData(encryptedStr) {
            try {
                const encrypted = atob(encryptedStr);
                let decrypted = '';
                for (let i = 0; i < encrypted.length; i++) {
                    decrypted += String.fromCharCode(encrypted.charCodeAt(i) ^ ENCRYPTION_KEY.charCodeAt(i % ENCRYPTION_KEY.length));
                }
                return JSON.parse(decrypted);
            } catch (e) {
                return JSON.parse(encryptedStr); // Fallback for old data
            }
        }

        function saveEvents() { 
            localStorage.setItem('calEvents', encryptData(events)); 
        }
        
        function saveTasks() { 
            localStorage.setItem('calTasks', encryptData(tasks)); 
        }
        
        function saveSummaries() { 
            localStorage.setItem('calSummaries', encryptData(summaries)); 
        }
        
        function saveProfile() { 
            localStorage.setItem('userProfile', encryptData(userProfile)); 
        }
        
        function getDateStr(date) { return date.toISOString().split('T')[0]; }
        
        function updateLiveClock() {
            const clock = document.getElementById('live-clock');
            if (!clock) return;
            function tick() {
                const now = new Date();
                clock.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            }
            tick();
            setInterval(tick, 30000);
        }
        
        function updateProfileUI() {
            const locEl = document.getElementById('user-location');
            if (locEl) locEl.textContent = userProfile.location;
            
            const avatar = document.getElementById('profile-avatar');
            if (avatar) {
                avatar.style.background = `linear-gradient(135deg, ${userProfile.avatarColor}, #d97706)`;
                avatar.textContent = userProfile.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
            }
        }
        
        // View Switching
        function switchView(view) {
            currentView = view;
            
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');
            
            renderCurrentView();
        }
        
        function renderCurrentView() {
            const container = document.getElementById('view-container');
            container.innerHTML = '';
            
            if (currentView === 'month') {
                renderMonthView(container);
            } else if (currentView === 'week') {
                renderWeekView(container);
            } else if (currentView === 'agenda') {
                renderAgendaView(container);
            }
        }
        
        function renderMonthView(container) {
            const grid = document.createElement('div');
            grid.className = 'calendar-grid h-full grid grid-cols-7 auto-rows-fr text-sm md:text-base bg-[#e5e7eb] dark:bg-gray-800 rounded-3xl overflow-hidden shadow-inner';
            
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            
            const desktopTitle = document.getElementById('current-month');
            if (desktopTitle) desktopTitle.innerHTML = `<span class="font-semibold">${currentViewDate.toLocaleString('default', { month: 'long' })}</span> ${year}`;
            
            const mobileMonth = document.getElementById('mobile-month');
            if (mobileMonth) mobileMonth.innerHTML = currentViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            const mainTitle = document.getElementById('main-month-title');
            if (mainTitle) mainTitle.innerHTML = currentViewDate.toLocaleString('default', { month: 'long' });
            
            const subtitle = document.getElementById('main-month-subtitle');
            if (subtitle) {
                const monthEvents = events.filter(e => {
                    const d = new Date(e.date);
                    return d.getMonth() === month && d.getFullYear() === year;
                }).length;
                subtitle.innerHTML = `${year} • ${monthEvents} events`;
            }
            
            const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            weekdays.forEach(day => {
                const h = document.createElement('div');
                h.className = 'bg-white dark:bg-[#0f172a] py-2.5 md:py-3 text-center text-xs font-bold text-gray-400 dark:text-gray-500 tracking-widest';
                h.textContent = day;
                grid.appendChild(h);
            });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();
            const todayStr = getDateStr(new Date());
            
            for (let i = 0; i < firstDay; i++) {
                const cell = createDayCell(daysInPrev - firstDay + i + 1, true, `${year}-${String(month).padStart(2,'0')}-${String(daysInPrev - firstDay + i + 1).padStart(2,'0')}`);
                grid.appendChild(cell);
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const isToday = todayStr === dateStr;
                const cell = createDayCell(day, false, dateStr, isToday);
                grid.appendChild(cell);
            }
            
            const total = firstDay + daysInMonth;
            for (let i = 1; i <= (42 - total); i++) {
                const cell = createDayCell(i, true, `${year}-${String(month+2).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
                grid.appendChild(cell);
            }
            
            container.appendChild(grid);
            
            if (selectedDateStr) {
                const sel = grid.querySelector(`[data-date="${selectedDateStr}"]`);
                if (sel) sel.classList.add('selected');
            }
        }
        
        function renderWeekView(container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'h-full flex flex-col bg-white dark:bg-[#0f172a] rounded-3xl overflow-hidden border border-gray-200 dark:border-gray-800';
            
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const day = currentViewDate.getDate();
            
            const startDate = new Date(year, month, day);
            startDate.setDate(startDate.getDate() - startDate.getDay());
            
            const header = document.createElement('div');
            header.className = 'flex items-center justify-between px-5 py-3 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900';
            header.innerHTML = `
                <div>
                    <div class="font-semibold text-lg">${startDate.toLocaleDateString('en-US', { month: 'long' })} ${startDate.getDate()} – ${new Date(startDate.getTime() + 6*86400000).toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}</div>
                    <div class="text-xs text-gray-500 dark:text-gray-400">${year}</div>
                </div>
                <div class="flex gap-2">
                    <button onclick="prevWeek()" class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-800 rounded-2xl">←</button>
                    <button onclick="nextWeek()" class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-800 rounded-2xl">→</button>
                </div>
            `;
            wrapper.appendChild(header);
            
            const daysContainer = document.createElement('div');
            daysContainer.className = 'flex-1 overflow-auto p-3 grid grid-cols-1 md:grid-cols-7 gap-3';
            
            for (let i = 0; i < 7; i++) {
                const currentDay = new Date(startDate);
                currentDay.setDate(startDate.getDate() + i);
                const dateStr = getDateStr(currentDay);
                const isToday = dateStr === getDateStr(new Date());
                
                const dayEl = document.createElement('div');
                dayEl.className = `border border-gray-200 dark:border-gray-700 rounded-2xl p-3 min-h-[140px] cursor-pointer ${isToday ? 'ring-2 ring-emerald-500' : ''}`;
                dayEl.dataset.date = dateStr;
                dayEl.onclick = () => {
                    selectedDateStr = dateStr;
                    if (window.innerWidth < 768) showBottomSheet(dateStr);
                    else renderDayDetails(dateStr);
                };
                
                // Make day droppable
                dayEl.ondragover = (e) => e.preventDefault();
                dayEl.ondrop = (e) => {
                    e.preventDefault();
                    const eventId = e.dataTransfer.getData('text/plain');
                    moveEventToDate(eventId, dateStr);
                };
                
                const dayEvents = events.filter(e => e.date === dateStr).sort((a,b) => a.time.localeCompare(b.time));
                const dayTasks = tasks.filter(t => t.date === dateStr && !t.done);
                
                let eventsHTML = dayEvents.slice(0, 3).map(ev => `
                    <div class="flex items-center gap-1.5 bg-gray-100 dark:bg-gray-800 rounded-xl px-2 py-1 draggable-event" 
                         draggable="true" 
                         data-event-id="${ev.id}"
                         ondragstart="event.dataTransfer.setData('text/plain', '${ev.id}')">
                        <span class="font-mono text-[10px] text-gray-500">${ev.time}</span>
                        <span class="truncate flex-1">${ev.title}</span>
                    </div>
                `).join('');
                
                dayEl.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="text-xs text-gray-500 dark:text-gray-400">${currentDay.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                            <div class="text-2xl font-bold ${isToday ? 'text-emerald-600' : ''}">${currentDay.getDate()}</div>
                        </div>
                        ${dayEvents.length > 0 ? `<div class="text-xs px-2 py-0.5 bg-[#007AFF] text-white rounded-full">${dayEvents.length}</div>` : ''}
                    </div>
                    
                    <div class="space-y-1 text-xs">
                        ${eventsHTML}
                        ${dayTasks.length > 0 ? `<div class="text-emerald-600 dark:text-emerald-400 text-[10px] mt-1">+${dayTasks.length} tasks</div>` : ''}
                    </div>
                `;
                
                daysContainer.appendChild(dayEl);
            }
            
            wrapper.appendChild(daysContainer);
            container.appendChild(wrapper);
        }
        
        function renderAgendaView(container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'h-full overflow-auto bg-white dark:bg-[#0f172a] rounded-3xl border border-gray-200 dark:border-gray-800 p-4';
            
            const sortedEvents = [...events].sort((a, b) => new Date(a.date) - new Date(b.date) || a.time.localeCompare(b.time));
            
            if (sortedEvents.length === 0) {
                wrapper.innerHTML = `<div class="text-center py-12 text-gray-400 dark:text-gray-500">No events yet. Add some using Quick Add!</div>`;
                container.appendChild(wrapper);
                return;
            }
            
            let currentDate = '';
            sortedEvents.forEach(ev => {
                if (ev.date !== currentDate) {
                    currentDate = ev.date;
                    const dateHeader = document.createElement('div');
                    dateHeader.className = 'sticky top-0 bg-white dark:bg-[#0f172a] py-2 text-sm font-semibold text-gray-500 dark:text-gray-400 border-b border-gray-200 dark:border-gray-800 mb-2';
                    dateHeader.textContent = new Date(ev.date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                    wrapper.appendChild(dateHeader);
                }
                
                const evEl = document.createElement('div');
                evEl.className = `flex items-start gap-4 p-3 rounded-2xl hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer mb-1 border-l-4`;
                evEl.style.borderColor = CALENDAR_COLORS[ev.calendar] || '#007AFF';
                evEl.onclick = () => {
                    selectedDateStr = ev.date;
                    if (window.innerWidth < 768) showBottomSheet(ev.date);
                    else renderDayDetails(ev.date);
                };
                
                evEl.innerHTML = `
                    <div class="w-14 text-right flex-shrink-0">
                        <div class="font-mono text-sm font-semibold">${ev.time}</div>
                        <div class="text-[10px] text-gray-400 dark:text-gray-500">${ev.recurring ? '⟳ ' + ev.recurring : ''}</div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold">${ev.title}</div>

        function parseNaturalLanguage(text) {
            const lower = text.toLowerCase();
            let date = new Date();
            let time = '09:00';
            let title = text;
            let recurring = '';
            
            const timeMatch = lower.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
            if (timeMatch) {
                let h = parseInt(timeMatch[1]);
                let m = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
                const ampm = timeMatch[3];
                
                if (ampm === 'pm' && h < 12) h += 12;
                if (ampm === 'am' && h === 12) h = 0;
                
                time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            }
            
            if (lower.includes('tomorrow')) {
                date.setDate(date.getDate() + 1);
            } else if (lower.includes('next week')) {
                date.setDate(date.getDate() + 7);
            } else if (lower.includes('friday')) {
                const daysUntilFriday = (5 - date.getDay() + 7) % 7 || 7;
                date.setDate(date.getDate() + daysUntilFriday);
            } else if (lower.includes('monday')) {
                const daysUntilMonday = (1 - date.getDay() + 7) % 7 || 7;
                date.setDate(date.getDate() + daysUntilMonday);
            }
            
            if (lower.includes('every day') || lower.includes('daily')) recurring = 'daily';
            else if (lower.includes('every week') || lower.includes('weekly')) recurring = 'weekly';
            else if (lower.includes('every month') || lower.includes('monthly')) recurring = 'monthly';
            
            title = text.replace(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i, '')
                        .replace(/tomorrow|next week|friday|monday|every day|daily|weekly|monthly/gi, '')
                        .trim();
            
            if (!title) title = 'Untitled Event';
            
            return {
                date: getDateStr(date),
                time,
                title,
                recurring,
                description: '',
                alertMinutes: 15,
                calendar: 'personal'
            };
        }

        function generateRecurringEvents(baseEvent) {
            const baseDate = new Date(baseEvent.date);
            let nextDate = new Date(baseDate);
            
            for (let i = 1; i <= 12; i++) {
                if (baseEvent.recurring === 'daily') nextDate.setDate(nextDate.getDate() + 1);
                else if (baseEvent.recurring === 'weekly') nextDate.setDate(nextDate.getDate() + 7);
                else if (baseEvent.recurring === 'monthly') nextDate.setMonth(nextDate.getMonth() + 1);
                
                const newEv = {
                    ...baseEvent,
                    id: 'e_' + Date.now().toString(36) + i,
                    date: getDateStr(nextDate)
                };
                events.push(newEv);
            }
        }

        function scheduleNotification(event) {
            if (!event.alertMinutes || !event.time) return;
            const eventDT = new Date(`${event.date}T${event.time}`);
            const alertT = new Date(eventDT.getTime() - event.alertMinutes * 60000);
            if (alertT <= new Date()) return;
            
            const ms = alertT.getTime() - Date.now();
            if (timers[event.id]) clearTimeout(timers[event.id]);
            
            timers[event.id] = setTimeout(() => {
                const body = `${event.time} • ${event.description || 'Tap to view'}`;
                showRealNotification(`🗓️ ${event.title}`, body, event.id);
                delete timers[event.id];
            }, ms);
        }
        
        function rescheduleAllAlerts() {
            const now = new Date();
            events.forEach(ev => {
                if (!ev.alertMinutes) return;
                const evDT = new Date(`${ev.date}T${ev.time}`);
                const alertT = new Date(evDT.getTime() - ev.alertMinutes * 60000);
                if (alertT > now) {
                    const ms = alertT.getTime() - now.getTime();
                    if (timers[ev.id]) clearTimeout(timers[ev.id]);
                    timers[ev.id] = setTimeout(() => {
                        if (Notification.permission === 'granted') new Notification(`🗓️ ${ev.title}`, { body: `${ev.time}` });
                        else showToast(`Reminder: ${ev.title}`);
                        delete timers[ev.id];
                    }, ms);
                }
            });
        }
        
        function renderMiniCalendar() {
            const container = document.getElementById('mini-calendar');
            if (!container) return;
            container.innerHTML = '';
            
            const year = miniViewDate.getFullYear();
            const month = miniViewDate.getMonth();
            
            ['S','M','T','W','T','F','S'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'text-center text-[10px] font-bold text-gray-400 dark:text-gray-500 py-1';
                el.textContent = d;
                container.appendChild(el);
            });
            
            const first = new Date(year, month, 1).getDay();
            const dim = new Date(year, month + 1, 0).getDate();
            const prevDim = new Date(year, month, 0).getDate();
            const todayStr = getDateStr(new Date());
            
            for (let i = 0; i < first; i++) {
                const el = document.createElement('div');
                el.className = 'mini-day text-center text-[10px] py-1 text-gray-300 dark:text-gray-600';
                el.textContent = prevDim - first + i + 1;
                container.appendChild(el);
            }
            
            for (let d = 1; d <= dim; d++) {
                const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const el = document.createElement('div');
                el.className = `mini-day text-center text-[10px] py-1 font-medium cursor-pointer rounded-xl ${ds === todayStr ? 'bg-emerald-500 text-white' : ''}`;
                if (ds === selectedDateStr) el.classList.add('!bg-[#007AFF]', '!text-white', 'font-bold');
                el.textContent = d;
                el.onclick = () => {
                    currentViewDate = new Date(year, month, d);
                    selectedDateStr = ds;
                    renderCurrentView();
                    if (window.innerWidth >= 768) renderDayDetails(ds);
                    else showBottomSheet(ds);
                    renderMiniCalendar();
                };
                container.appendChild(el);
            }
            
            const rem = 42 - (first + dim);
            for (let i = 1; i <= rem; i++) {
                const el = document.createElement('div');
                el.className = 'mini-day text-center text-[10px] py-1 text-gray-300 dark:text-gray-600';
                el.textContent = i;
                container.appendChild(el);
            }
        }

        function renderUpcoming() {
            const container = document.getElementById('upcoming-list');
            if (!container) return;
            container.innerHTML = '';
            
            const now = new Date();
            const nowStr = getDateStr(now);
            
            let upcoming = events
                .filter(e => {
                    const d = new Date(e.date);
                    return d >= now || (e.date === nowStr && e.time >= now.toTimeString().slice(0,5));
                })
                .sort((a,b) => new Date(a.date) - new Date(b.date) || a.time.localeCompare(b.time))
                .slice(0, 6);
            
            if (currentFilter !== 'all') upcoming = upcoming.filter(e => e.calendar === currentFilter);
            
            if (upcoming.length === 0) {
                container.innerHTML = `<div class="px-3 py-5 text-center text-xs text-gray-400 dark:text-gray-500">No upcoming events</div>`;
                return;
            }
            
            upcoming.forEach(ev => {

                const isToday = ev.date === nowStr;
                const item = document.createElement('div');

                item.onclick = () => {

        function changeAvatarColor() {
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#ef4444'];
            const current = userProfile.avatarColor;
            let idx = colors.indexOf(current);

            userProfile.avatarColor = newColor;
            saveProfile();
            updateProfileUI();
            
            const modalAvatar = document.getElementById('modal-avatar');

        function saveProfileFromModal() {

            if (locInput) userProfile.location = locInput.value.trim() || 'Abuja, NG';

        function resetProfile() {
            if (!confirm('Reset profile to defaults?')) return;
            
            userProfile = { name: 'Dear Trader', location: 'Abuja, NG', avatarColor: '#f59e0b' };

            updateProfileUI();
            
            const modal = document.querySelector('.fixed.inset-0');
            if (modal) modal.remove();

        function switchMobileTab(tab) {
            currentMobileTab = tab;
            document.querySelectorAll('[id^="nav-"]').forEach((el, i) => {
                el.classList.toggle('nav-active', i === tab);
                el.classList.toggle('text-gray-500', i !== tab);
                el.classList.toggle('dark:text-gray-400', i !== tab);
            });
            
            if (tab === 0) {
                switchView('month');
            } else if (tab === 1) {
                switchView('agenda');
            }
        }
        
        // Security: Strong Input Sanitization (XSS Prevention)
        function sanitizeInput(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .trim()
                .substring(0, 500);
        }

        // Security: Rate limiting
        let lastEventCreation = 0;
        function checkRateLimit() {
            const now = Date.now();
            if (now - lastEventCreation < 800) {
                showToast('Please wait before adding another event', 'error');
                return false;
            }
            lastEventCreation = now;
            return true;
        }

        // Security: Secure ID generation
        function generateSecureId() {
            return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Security: Detect when user opens Inspect Element (DevTools)
        let devtoolsOpen = false;
        setInterval(() => {
            const threshold = 160;
            const widthDiff = window.outerWidth - window.innerWidth > threshold;
            const heightDiff = window.outerHeight - window.innerHeight > threshold;
            
            if ((widthDiff || heightDiff) && !devtoolsOpen) {
                devtoolsOpen = true;
                console.clear();
                console.log('%c[ScheduCal] Production build. Source protected.', 'color:#888; font-size:9px');
                
                // Extra protection
                document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#666">Access Denied</div>';
            }
        }, 1200);

        // Disable right-click and common shortcuts
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))) {
                e.preventDefault();
                return false;
            }
        });

        // PWA Install Function (Android + Desktop)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('install-btn');
            if (installBtn) installBtn.style.display = 'flex';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        showToast('ScheduCal installed successfully!');
                    }
                    deferredPrompt = null;
                    const installBtn = document.getElementById('install-btn');
                    if (installBtn) installBtn.style.display = 'none';
                });
            } else {
                showToast('To install: Tap browser menu → "Add to Home Screen"', 'info', 4000);
            }
        }

        function showToast(msg, type = 'success', duration = 2600) {
            const c = document.getElementById('toast-container');
            const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-gray-800 dark:bg-gray-700' };
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            
            const t = document.createElement('div');
            t.className = `flex items-center gap-3 px-5 py-3 rounded-2xl shadow-xl text-white max-w-[260px] ${colors[type]}`;
            t.innerHTML = `<i class="fas ${icons[type]} text-lg"></i><span class="text-sm font-medium">${msg}</span>`;
            c.appendChild(t);
            
            setTimeout(() => {
                t.style.transition = 'all .3s ease';
                t.style.opacity = '0';
                t.style.transform = 'translateX(30px)';
                setTimeout(() => t.remove(), 280);
            }, duration);
        }
        
        function setupKeyboard() {
            document.addEventListener('keydown', e => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); showSearchModal(); }
                if (e.key === 'Escape') {
                    const modals = document.querySelectorAll('.fixed.inset-0');
                    if (modals.length) modals[modals.length-1].remove();
                    else {
                        const s = document.getElementById('search-modal');
                        if (!s.classList.contains('hidden')) hideSearchModal();
                        const bs = document.getElementById('bottom-sheet');
                        if (!bs.classList.contains('hidden')) hideBottomSheet();
                    }
                }
                if (e.key.toLowerCase() === 't' && document.activeElement.tagName === 'BODY') goToToday();
                if (e.key === 'ArrowLeft') { if (currentView === 'month') prevMonth(); else if (currentView === 'week') prevWeek(); }
                if (e.key === 'ArrowRight') { if (currentView === 'month') nextMonth(); else if (currentView === 'week') nextWeek(); }
            });
            
            setTimeout(() => {
                if (window.innerWidth < 768) {
                    const hint = document.createElement('div');
                    hint.className = 'fixed bottom-16 left-1/2 -translate-x-1/2 text-xs bg-white/95 dark:bg-gray-800/95 border px-4 py-1 rounded-3xl shadow text-gray-500 dark:text-gray-400 flex items-center gap-2 z-50';
                    hint.innerHTML = `Try natural language in Quick Add`;
                    document.body.appendChild(hint);
                    setTimeout(() => { hint.style.transition='opacity .4s'; hint.style.opacity='0'; setTimeout(()=>hint.remove(),400); }, 4200);
                }
            }, 5200);
        }
        
        function requestNotif() {
            if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(() => {
                    Notification.requestPermission().then(p => {
                        if (p === 'granted') showToast('Reminders enabled', 'info');
                    });
                }, 3800);
            }
        }

        // Register Service Worker for Real Notifications
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('[SW] Registered successfully');
                        window.swRegistration = reg;
                    })
                    .catch(err => console.log('[SW] Registration failed:', err));
            }
        }

        // Enable Real Push Notifications
        async function enablePushNotifications() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                showToast('Push not supported in this browser', 'error');
                return;
            }

            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    showToast('Permission denied', 'error');
                    return;
                }

                const reg = await navigator.serviceWorker.ready;
                showToast('Push notifications enabled! (Best with PWA install)', 'success', 5000);
                localStorage.setItem('pushEnabled', 'true');
            } catch (err) {
                showToast('Failed to enable push', 'error');
            }
        }

        // Show REAL notification via Service Worker
        function showRealNotification(title, body, tag) {
            if (window.swRegistration && window.swRegistration.active) {
                window.swRegistration.active.postMessage({
                    type: 'SHOW_NOTIFICATION',
                    title: title,
                    body: body,
                    tag: tag
                });
            } else if (Notification.permission === 'granted') {
                // Fallback to regular notification
                new Notification(title, {
                    body: body,
                    icon: 'https://cdn-icons-png.flaticon.com/512/747/747310.png',
                    tag: tag
                });
            } else {
                showToast(`${title}: ${body}`, 'info', 8000);
            }
        }
        
        function showConfetti() {
            for (let i = 0; i < 28; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.style.cssText = `position:fixed;left:${Math.random()*100}vw;top:-10px;width:8px;height:8px;border-radius:50%;background:${['#007AFF','#10b981','#f59e0b','#8b5cf6'][Math.floor(Math.random()*4)]};z-index:99999;transition:transform 1.2s ease,opacity 1.2s ease`;
                    document.body.appendChild(c);
                    setTimeout(() => {
                        c.style.transform = `translateY(${window.innerHeight+80}px) rotate(${Math.random()*420}deg)`;
                        c.style.opacity = '0';
                        setTimeout(() => c.remove(), 1200);
                    }, 50);
                }, i * 11);
            }
        }
        
        function exportToICS() {
            let ics = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Dear Trader Calendar//EN\n`;
            
            events.forEach(ev => {
                const start = ev.date.replace(/-/g, '') + 'T' + ev.time.replace(':', '') + '00';
                ics += `BEGIN:VEVENT\nUID:${ev.id}@deartrader.app\nDTSTART:${start}\nSUMMARY:${ev.title}\nDESCRIPTION:${ev.description || ''}\nEND:VEVENT\n`;
            });
            
            ics += `END:VCALENDAR`;
            
            const blob = new Blob([ics], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'dear-trader-calendar.ics';
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('Calendar exported as .ics');
        }

        function initApp() {
            try {
                initTailwind();
                loadData();
                registerServiceWorker();
                
                if (!document.getElementById('analytics-tab')) {
                    // Analytics tab placeholder - add full implementation if needed
                    console.log('[ScheduCal] Analytics tab placeholder');

                // Show beautiful onboarding for first-time users

                    console.error('[ScheduCal Error]', e);

                showToast('Failed to start ScheduCal', 'error');

            renderCurrentView();

            const btn = document.getElementById('submit-btn');

            console.log('%c[Ultimate Calendar] All features added: Natural language, Recurring, Week/Agenda views, Multiple calendars, Tasks, Export, Profile, Theme, Animated orbs', 'color:#64748b');
        }
        
        window.onload = initApp;
        window.CalendarApp = { goToToday, selectDate, toggleTheme, exportToICS };
        
        window.exportCalendar = () => {
            const a = document.createElement('a');
            a.href = '#';
            a.onclick = () => { exportToICS(); return false; };
            document.body.appendChild(a);
            a.click();
            a.remove();
        };
    </script>
